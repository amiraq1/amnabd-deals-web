name: Verify & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily rebuild so Supabase status and end-date changes reach sitemap.xml,
  # feed.xml and static deal pages without a commit. Scheduled runs use the
  # default branch only and take the same main path as a push.
  schedule:
    - cron: '17 3 * * *'

# Least privilege by default; the deploy job escalates for Pages only.
permissions:
  contents: read

concurrency:
  # One group per branch/PR: a pull request must not cancel a deploy that is
  # already running on main, which the old workflow-wide `pages` group allowed.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  # Stale pull-request runs are worth cancelling; a main deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate: every change (PR or main) must typecheck, lint and pass tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Proves the public-key guard still rejects private/malformed config.
      # Synthetic fixtures only — no production secrets involved.
      - run: npm run test:build-env
      # AMN-001: runtime dependencies must stay clean. Dev-tool advisories are
      # tolerated until the Vite/Tailwind major upgrade lands, but nothing that
      # ships to a visitor may be flagged.
      - run: npm audit --omit=dev --audit-level=high

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    # PRs use synthetic fixtures; production build is permitted only on main.
    # Manual dispatches on other refs stop after the secret-free verify job.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the main production path receives secret values for this check.
      - name: Validate production secrets on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required production Supabase secrets on refs/heads/main."
            exit 1
          fi
      # Build and source verification share only this step's required config.
      - name: Build and verify with fixture config for PRs or production config on main
        run: npm run build && node scripts/verify-dist.mjs
        env:
          VITE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://audit-fixture.supabase.co' || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'sb_publishable_AUDIT_FIXTURE_NOT_A_REAL_KEY_0001' || secrets.VITE_SUPABASE_ANON_KEY }}
          SEO_PARITY_SOURCE: ${{ github.event_name == 'pull_request' && 'snapshot' || 'live' }}
      # Stops the initial payload from growing unnoticed while no Lighthouse
      # baseline exists yet (audit AMN-011). Raise budgets in a commit, not here.
      - run: npm run test:bundle
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
