name: Verify & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job escalates for Pages only.
permissions:
  contents: read

concurrency:
  # One group per branch/PR: a pull request must not cancel a deploy that is
  # already running on main, which the old workflow-wide `pages` group allowed.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  # Stale pull-request runs are worth cancelling; a main deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate: every change (PR or main) must typecheck, lint and pass tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Proves the public-key guard still rejects private/malformed config.
      # Synthetic fixtures only — no production secrets involved.
      - run: npm run test:build-env
      # AMN-001: runtime dependencies must stay clean. Dev-tool advisories are
      # tolerated until the Vite/Tailwind major upgrade lands, but nothing that
      # ships to a visitor may be flagged.
      - run: npm audit --omit=dev --audit-level=high

  build:
    needs: verify
    # Builds on pull requests too, so verify-dist gates the claims before merge.
    # Publishing stays gated below.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Declared once: every step inherits these. Fork PRs never receive
    # repository secrets, so they build against the same public fixtures
    # test:build-env uses; a production run without secrets must fail rather
    # than quietly build the fixture.
    env:
      VITE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://audit-fixture.supabase.co' || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'sb_publishable_AUDIT_FIXTURE_NOT_A_REAL_KEY_0001' || secrets.VITE_SUPABASE_ANON_KEY }}
      SEO_PARITY_SOURCE: ${{ github.event_name == 'pull_request' && 'snapshot' || 'live' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails before the build instead of producing a fixture build on main.
      - name: Validate production secrets on non-PR builds
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required production Supabase secrets on ${{ github.ref }}."
            exit 1
          fi
      - run: npm run build
      # Fails the build if dist/ publishes a claim the catalog cannot prove.
      - run: node scripts/verify-dist.mjs
      # Stops the initial payload from growing unnoticed while no Lighthouse
      # baseline exists yet (audit AMN-011). Raise budgets in a commit, not here.
      - run: npm run test:bundle
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
